# pnpm 11 requires an explicit decision for every dependency with an install
# script. Without this file pnpm halts with ERR_PNPM_IGNORED_BUILDS before
# running any script, which breaks `pnpm test` and the husky hooks.
#
# CI pins pnpm 9.14.4, which reads this file strictly as a workspace manifest
# and fails with "packages field missing or empty" unless `packages` is present.
# This repo is a single package, so the root is the only entry; pnpm 9 ignores
# allowBuilds, and pnpm 11 honours it.
packages:
  - .

allowBuilds:
  # tsup and vitest both need esbuild's platform binary.
  esbuild: true
  # Next.js image optimisation in docs/.
  sharp: true
  # lefthook.yml runs `pnpm dlx ultracite fix`, which this repo deliberately
  # avoids (see CLAUDE.md). Husky owns the hooks via core.hooksPath, so
  # lefthook's installer must not run and register competing hooks.
  lefthook: false
