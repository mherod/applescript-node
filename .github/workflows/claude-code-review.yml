name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ⚠️ CRITICAL FIRST STEP - CHECK FOR EXISTING COMMENTS:
            Before doing ANYTHING else, you MUST run `gh pr view --comments` to check if you have previously commented on this PR.

            If you have an existing comment:
            1. Review the current PR state using `gh pr diff` and `gh pr view`
            2. Compare the current state against issues raised in your previous comment
            3. UPDATE your existing comment using `gh pr comment --edit-last` - do NOT create a new comment
               - If all issues are resolved: Update to acknowledge the fixes, or delete with `gh pr comment --delete-last --yes`
               - If some issues remain: Update with current status, noting what's fixed and what still needs work
               - If new issues found: Update to include new feedback alongside any remaining original issues
            4. If your previous comment contained a checklist of issues:
               - Review each checklist item against the current code
               - Mark items as complete (- [x]) when the issue has been addressed
               - Keep items unchecked (- [ ]) if they still need work
               - Add new checklist items for any new issues discovered
               - This gives the PR author clear visibility of progress
            5. Only create a NEW comment if you have never commented on this PR before

            This prevents comment spam and maintains a clean, trackable review history.

            ---

            Review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Before commenting, use `gh pr view --comments` to read all existing pull request comments to avoid repeating comments that have already been raised by others.

            Use `gh pr diff` to view the diff of the PR.

            Use `gh pr view` to view the PR.

            Use `gh pr comment` (or `gh pr comment --edit-last` if updating) with your Bash tool to leave your review as a comment on the PR.

            PR Review Actions (after providing feedback):
            - After leaving comments, evaluate whether a formal PR review is appropriate
            - Do NOT submit a PR review (`gh pr review`) if:
              * You have left comments with outstanding issues that need to be addressed
              * There are critical problems that prevent the PR from being merged
              * You need to see how the author responds to your feedback first
            - Submit an approval review using `gh pr review --approve --body "..."` ONLY if:
              * The PR appears acceptable and ready to merge
              * All your concerns have been addressed (either in the current state or through previous comment updates)
              * There are no outstanding issues remaining
            - Submit a request changes review using `gh pr review --request-changes --body "..."` if:
              * There are critical problems that must be fixed before the PR can be merged
              * The issues are significant enough to block approval
              * Use this sparingly - most feedback can be provided via comments alone

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr review:*)"'
