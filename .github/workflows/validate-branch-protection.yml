name: Validate Branch Protection

# Detects drift between .github/required-checks.txt (the declared required
# checks) and the job names the test matrix actually generates.  When they
# diverge, branch protection will either deadlock PRs (stale required check
# that never runs) or silently under-protect main (new job not yet required).
#
# How to keep things in sync when you change the matrix:
#   1. Update .github/workflows/test.yml  (matrix node-version list)
#   2. Update .github/required-checks.txt (one check name per line)
#   3. Update branch protection via GitHub Settings > Branches > main
#      (or run: gh api repos/OWNER/REPO/branches/main/protection --method PUT ...)
#
# This workflow validates steps 1+2 are consistent.  Step 3 is an admin
# action that cannot be performed with the standard GITHUB_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - .github/workflows/validate-branch-protection.yml
      - .github/required-checks.txt
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - .github/workflows/validate-branch-protection.yml
      - .github/required-checks.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check required status checks match matrix jobs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate — no check names contain the pipe delimiter
        run: |
          # The pipe character (|) is used as the internal delimiter when
          # sorting and comparing check name lists.  A name that itself
          # contains | would be silently split into extra tokens, corrupting
          # both the expected and actual lists and producing false match/mismatch.
          #
          # This step is a hard gate: if any name in required-checks.txt
          # contains |, we fail immediately with a clear error before any
          # comparison logic runs.

          FAIL=0

          echo "Scanning .github/required-checks.txt for pipe characters..."
          while IFS= read -r line; do
            # Skip blank / whitespace-only lines
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            if [[ "$line" == *"|"* ]]; then
              echo "❌ Invalid check name contains '|': $line"
              echo "   The pipe character is reserved as the internal delimiter."
              echo "   GitHub Actions does not permit '|' in job names — remove it."
              FAIL=$((FAIL + 1))
            fi
          done < .github/required-checks.txt

          if [ "$FAIL" -eq 0 ]; then
            echo "✅ No pipe characters found in required-checks.txt"
          else
            echo ""
            echo "$FAIL invalid name(s) detected. Fix required-checks.txt before proceeding."
            exit 1
          fi

      - name: Regression test — pipe delimiter handles space-containing check names
        run: |
          # Regression test for the bug where `tr ' ' '\n'` shattered
          # "test (20)" (a name containing spaces) into three separate tokens:
          #   "test", "(20)", "test", "(22)" → 4 tokens instead of 2
          #
          # The fix uses "|" as the delimiter so spaces inside names are preserved.
          # This step explicitly verifies the correct behaviour and documents
          # what the broken path would have produced.

          echo "=== Regression: space-containing check names with pipe delimiter ==="

          # Simulate the output of the "Derive expected check names" step when
          # the matrix is [20, 22] and the job ID is "test".
          INPUT="test (20)|test (22)"

          # ── CORRECT path (current implementation) ─────────────────────────
          SORTED=$(echo "$INPUT" | tr '|' '\n' | sort | paste -sd '|')
          echo "Correct  → $SORTED"
          EXPECTED="test (20)|test (22)"
          if [ "$SORTED" != "$EXPECTED" ]; then
            echo "❌ FAIL: pipe-delimiter path produced '$SORTED', expected '$EXPECTED'"
            exit 1
          fi
          echo "✅ Pipe-delimiter path: correct ($SORTED)"

          # ── BROKEN path (space-split — must produce wrong token count) ─────
          BROKEN_COUNT=$(echo "$INPUT" | tr '|' ' ' | tr ' ' '\n' | grep -c .)
          echo "Broken   → $BROKEN_COUNT tokens (expected 6, not 2)"
          # "test (20) test (22)" split on spaces → "test", "(20)", "test", "(22)" = 4
          # tokens.  It must NOT equal 2 (the correct number of check names).
          if [ "$BROKEN_COUNT" -eq 2 ]; then
            echo "❌ FAIL: space-split path accidentally produced the right count."
            echo "   The regression test is no longer valid — review the logic."
            exit 1
          fi
          echo "✅ Space-split path: confirmed broken (produces $BROKEN_COUNT tokens, not 2)"

          echo ""
          echo "Regression test passed."

      - name: Regression tests — property-based fuzz for name-parsing pipeline
        run: |
          # Property-based fuzz test for the sort-pipe-join parser.
          #
          # Rather than hard-coding fixed inputs, this step defines a set of
          # "name atoms" covering realistic special-character categories, then
          # automatically verifies three algebraic properties over all atoms
          # and all N-choose-2 pairs:
          #
          #   P1  Idempotency  — encode(sort({n})) == n  (single name round-trips)
          #   P2  Commutativity — sort({a,b}) == sort({b,a})  (order-independent)
          #   P3  Losslessness — |decode(encode(sort({a,b})))| == 2  (no token explosion)
          #
          # Also documents the known P4 limitation: names containing "|" break
          # the delimiter — GitHub Actions does not permit "|" in check names,
          # so this is acceptable.

          ATOMS=(
            "test (20)"               # parens + space — original bug trigger
            "test (22)"               # second matrix variant
            "build / lint"            # slash with spaces
            "integration test (18)"   # parens + multiple words
            "e2e  tests"              # double consecutive space
            "check.step"              # dot
            "run_tests-all"           # underscore + hyphen
            "deploy #staging"         # hash
            "@verify"                 # at-sign prefix
            "CI / CD (node-20)"       # slash, parens, hyphen combined
          )

          FAIL=0; PASS=0

          pass() { echo "  ✅ $1"; PASS=$((PASS + 1)); }
          fail() { echo "  ❌ $1"; echo "       $2"; FAIL=$((FAIL + 1)); }

          # ── P1: Single-name idempotency ───────────────────────────────────
          echo "P1  Idempotency — encode(sort({n})) == n"
          for name in "${ATOMS[@]}"; do
            result=$(echo "$name" | tr '|' '\n' | grep -v '^$' | sort | paste -sd '|')
            if [ "$result" = "$name" ]; then
              pass "'$name'"
            else
              fail "'$name' round-trip" "expected '$name', got '$result'"
            fi
          done

          # ── P2: Commutativity — order-independence over all pairs ─────────
          echo ""
          echo "P2  Commutativity — sort({a,b}) == sort({b,a})"
          PAIR_COUNT=0
          for i in "${!ATOMS[@]}"; do
            for j in "${!ATOMS[@]}"; do
              [ "$i" -ge "$j" ] && continue
              a="${ATOMS[$i]}"; b="${ATOMS[$j]}"
              fwd=$(printf '%s\n%s\n' "$a" "$b" | sort | paste -sd '|')
              rev=$(printf '%s\n%s\n' "$b" "$a" | sort | paste -sd '|')
              PAIR_COUNT=$((PAIR_COUNT + 1))
              if [ "$fwd" = "$rev" ]; then
                PASS=$((PASS + 1))
              else
                fail "('$a', '$b') order-independent" \
                  "forward='$fwd'  reversed='$rev'"
              fi
            done
          done
          echo "  ✅ $PAIR_COUNT pairs all commutative"

          # ── P3: Losslessness — no token explosion over all pairs ──────────
          echo ""
          echo "P3  Losslessness — |tokens| == 2 for every pair"
          for i in "${!ATOMS[@]}"; do
            for j in "${!ATOMS[@]}"; do
              [ "$i" -ge "$j" ] && continue
              a="${ATOMS[$i]}"; b="${ATOMS[$j]}"
              joined=$(printf '%s\n%s\n' "$a" "$b" | sort | paste -sd '|')
              count=$(echo "$joined" | tr '|' '\n' | grep -c .)
              if [ "$count" -eq 2 ]; then
                PASS=$((PASS + 1))
              else
                fail "token count for ('$a', '$b')" \
                  "expected 2 tokens, got $count from '$joined'"
              fi
            done
          done
          echo "  ✅ $PAIR_COUNT pairs all lossless (2 tokens preserved)"

          # ── P4 (known limitation): | in name breaks delimiter ─────────────
          echo ""
          echo "P4  Known limitation — '|' inside a name breaks the delimiter"
          PIPE_NAME="test | verify"
          encoded="${PIPE_NAME}|other check"
          tok=$(echo "$encoded" | tr '|' '\n' | grep -c .)
          if [ "$tok" -gt 2 ]; then
            echo "  ✅ Documented: pipe-containing names produce $tok tokens from 2 names."
            echo "     GitHub Actions does not permit '|' in check names, so this is safe."
            PASS=$((PASS + 1))
          else
            echo "  ⚠️  Pipe-name limitation appears to have changed — review delimiter choice."
          fi

          # ── P5: Validator rejects | and accepts clean names ───────────────
          echo ""
          echo "P5  Strict validation — validator correctly classifies names"

          validate_name() {
            # Returns 0 (clean) or 1 (contains pipe) — mirrors the gate step logic
            [[ "$1" == *"|"* ]] && return 1 || return 0
          }

          # Must reject: names containing |
          PIPE_CASES=("a|b" "test (20)|test (22)" "check|1" "|leading" "trailing|")
          for bad in "${PIPE_CASES[@]}"; do
            if ! validate_name "$bad"; then
              pass "rejects '$bad'"
            else
              fail "should reject '$bad'" "validator returned clean for a pipe-containing name"
            fi
          done

          # Must accept: all atoms in the test set (none contain |)
          for name in "${ATOMS[@]}"; do
            if validate_name "$name"; then
              pass "accepts '$name'"
            else
              fail "should accept '$name'" "validator wrongly rejected a pipe-free name"
            fi
          done

          # ── Summary ───────────────────────────────────────────────────────
          echo ""
          echo "Results: $PASS passed, $FAIL failed  (${#ATOMS[@]} atoms, $PAIR_COUNT pairs)"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Regression tests — edge cases in name-parsing pipeline
        run: |
          PASS=0; FAIL=0

          assert_eq() {
            local label="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  ✅ $label"
              PASS=$((PASS + 1))
            else
              echo "  ❌ $label"
              echo "       expected : $expected"
              echo "       actual   : $actual"
              FAIL=$((FAIL + 1))
            fi
          }

          # ── Case 1: Single check name (no pipe) ───────────────────────────
          # paste -sd '|' on a single line must not append a trailing |
          echo "Case 1: single check name"
          R=$(echo "test (20)" | tr '|' '\n' | sort | paste -sd '|')
          assert_eq "single name preserved intact" "$R" "test (20)"

          # ── Case 2: Three names, already sorted ───────────────────────────
          echo "Case 2: three names — already sorted (idempotent)"
          R=$(echo "test (18)|test (20)|test (22)" | tr '|' '\n' | sort | paste -sd '|')
          assert_eq "three sorted names unchanged" "$R" "test (18)|test (20)|test (22)"

          # ── Case 3: Three names, reverse order (sort correctness) ─────────
          echo "Case 3: three names — reverse order sorted correctly"
          R=$(echo "test (22)|test (20)|test (18)" | tr '|' '\n' | sort | paste -sd '|')
          assert_eq "reverse input sorts to ascending" "$R" "test (18)|test (20)|test (22)"

          # ── Case 4: Name with multiple consecutive spaces ─────────────────
          # GitHub check names can include descriptive labels with extra spaces
          # (e.g. a job named "integration  test (node 20)"). The pipe delimiter
          # must preserve all internal spaces unchanged.
          echo "Case 4: multiple consecutive spaces preserved"
          R=$(echo "test  (node  20)|test  (node  22)" | tr '|' '\n' | sort | paste -sd '|')
          assert_eq "double-space names preserved" "$R" "test  (node  20)|test  (node  22)"

          # ── Case 5: Blank and whitespace-only lines in required-checks.txt ─
          # required-checks.txt may contain blank lines for readability.
          # grep -v '^\s*$' must strip them before sorting.
          echo "Case 5: blank/whitespace lines filtered from required-checks.txt"
          MULTILINE=$(printf "test (20)\n\ntest (22)\n   \n\t\n")
          R=$(echo "$MULTILINE" | grep -v '^\s*$' | sort | paste -sd '|')
          assert_eq "blank lines stripped" "$R" "test (20)|test (22)"

          # ── Case 6: Name with slash and parens (realistic workflow names) ──
          # Workflows like "build / lint (node 20)" appear in monorepos.
          echo "Case 6: slash and parens in check name"
          R=$(echo "build / lint (node 22)|build / lint (node 20)" \
              | tr '|' '\n' | sort | paste -sd '|')
          assert_eq "slash+parens name sorts correctly" \
            "$R" "build / lint (node 20)|build / lint (node 22)"

          # ── Case 7: Tab characters in required-checks.txt ─────────────────
          # A tab-indented line must be treated as whitespace-only and filtered.
          echo "Case 7: tab-only line filtered as blank"
          TABLINE=$(printf "test (20)\n\t\ntest (22)\n")
          R=$(echo "$TABLINE" | grep -v '^\s*$' | sort | paste -sd '|')
          assert_eq "tab-only line filtered" "$R" "test (20)|test (22)"

          # ── Summary ───────────────────────────────────────────────────────
          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Derive expected check names from test.yml
        id: expected
        run: |
          # Extract job ID: first key under 'jobs:' in test.yml
          JOB_ID=$(grep -A1 '^jobs:' .github/workflows/test.yml \
            | tail -1 | sed 's/[: ]//g')

          # Extract node-version matrix values (e.g. [20, 22] → "20 22")
          VERSIONS=$(grep 'node-version:' .github/workflows/test.yml \
            | grep '\[' \
            | sed 's/.*\[//; s/\].*//; s/,/ /g')

          # Build expected check names one per line, then join with | for sorting
          EXPECTED_SORTED=""
          for V in $VERSIONS; do
            V=$(echo "$V" | tr -d ' ')
            [ -n "$EXPECTED_SORTED" ] && EXPECTED_SORTED="${EXPECTED_SORTED}|"
            EXPECTED_SORTED="${EXPECTED_SORTED}${JOB_ID} (${V})"
          done
          EXPECTED_SORTED=$(echo "$EXPECTED_SORTED" \
            | tr '|' '\n' | sort | paste -sd '|')

          echo "job_id=$JOB_ID"                 >> "$GITHUB_OUTPUT"
          echo "versions=$VERSIONS"             >> "$GITHUB_OUTPUT"
          echo "expected_sorted=$EXPECTED_SORTED" >> "$GITHUB_OUTPUT"
          echo "Derived job ID  : $JOB_ID"
          echo "Derived versions: $VERSIONS"
          echo "Expected (sorted, pipe-delim): $EXPECTED_SORTED"

      - name: Read declared required checks from required-checks.txt
        id: declared
        run: |
          # required-checks.txt is the committed source of truth.
          # It must be kept in sync with branch protection (admin action) and
          # with the matrix (validated here in CI).
          DECLARED_SORTED=$(grep -v '^\s*$' .github/required-checks.txt \
            | sort | paste -sd '|')
          echo "declared_sorted=$DECLARED_SORTED" >> "$GITHUB_OUTPUT"
          echo "Declared (sorted, pipe-delim): $DECLARED_SORTED"

      - name: Compare matrix-derived names vs declared required checks
        env:
          EXPECTED_SORTED: ${{ steps.expected.outputs.expected_sorted }}
          DECLARED_SORTED: ${{ steps.declared.outputs.declared_sorted }}
          JOB_ID: ${{ steps.expected.outputs.job_id }}
          VERSIONS: ${{ steps.expected.outputs.versions }}
        run: |
          echo "Matrix generates : $EXPECTED_SORTED"
          echo "required-checks  : $DECLARED_SORTED"

          if [ "$EXPECTED_SORTED" = "$DECLARED_SORTED" ]; then
            echo "✅ Matrix job names match .github/required-checks.txt."
            echo ""
            echo "Reminder: also ensure branch protection on main is in sync."
            echo "Required checks configured in branch protection must match:"
            echo "$DECLARED_SORTED" | tr '|' '\n' | sed 's/^/  - /'
          else
            echo "❌ MISMATCH detected!"
            echo ""
            echo "Matrix generates  : $EXPECTED_SORTED"
            echo "required-checks   : $DECLARED_SORTED"
            echo ""
            echo "To fix, update .github/required-checks.txt to match the job"
            echo "names the matrix produces, then also update branch protection:"
            echo ""
            echo "  Job ID        : $JOB_ID"
            echo "  Node versions : $VERSIONS"
            echo "  Expected names: $EXPECTED_SORTED" | tr '|' '\n'
            exit 1
          fi
