name: Validate Branch Protection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - .github/workflows/validate-branch-protection.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - .github/workflows/validate-branch-protection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check required status checks match matrix jobs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Derive expected check names from test.yml
        id: expected
        run: |
          # Extract job ID: first key under 'jobs:' in test.yml
          JOB_ID=$(grep -A1 '^jobs:' .github/workflows/test.yml \
            | tail -1 | sed 's/[: ]//g')

          # Extract node-version matrix values (e.g. [20, 22] → "20 22")
          VERSIONS=$(grep 'node-version:' .github/workflows/test.yml \
            | grep '\[' \
            | sed 's/.*\[//; s/\].*//; s/,/ /g')

          # Build expected check names: "<job-id> (<version>)" per matrix entry
          EXPECTED=""
          for V in $VERSIONS; do
            V=$(echo "$V" | tr -d ' ')
            EXPECTED="$EXPECTED $JOB_ID ($V)"
          done
          EXPECTED=$(echo "$EXPECTED" | xargs)

          echo "job_id=$JOB_ID"     >> "$GITHUB_OUTPUT"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Derived job ID  : $JOB_ID"
          echo "Derived versions: $VERSIONS"
          echo "Expected checks : $EXPECTED"

      - name: Fetch required checks from branch protection
        id: actual
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          CHECKS=$(gh api "repos/$REPO/branches/main/protection" \
            --jq '[.required_status_checks.checks[].context] | join(" ")' \
            2>&1) || CHECKS=""
          echo "actual=$CHECKS" >> "$GITHUB_OUTPUT"
          echo "Actual required checks: $CHECKS"

      - name: Compare expected vs actual
        env:
          EXPECTED: ${{ steps.expected.outputs.expected }}
          ACTUAL: ${{ steps.actual.outputs.actual }}
          JOB_ID: ${{ steps.expected.outputs.job_id }}
          VERSIONS: ${{ steps.expected.outputs.versions }}
        run: |
          # Sort both lists for order-independent comparison
          EXPECTED_SORTED=$(echo "$EXPECTED" \
            | tr ' ' '\n' | grep . | sort | paste -sd '|')
          ACTUAL_SORTED=$(echo "$ACTUAL" \
            | tr ' ' '\n' | grep . | sort | paste -sd '|')

          echo "Expected (sorted): $EXPECTED_SORTED"
          echo "Actual   (sorted): $ACTUAL_SORTED"

          if [ "$EXPECTED_SORTED" = "$ACTUAL_SORTED" ]; then
            echo "✅ Branch protection required checks match workflow matrix jobs."
          else
            echo "❌ MISMATCH detected!"
            echo ""
            echo "Branch protection requires : $ACTUAL_SORTED"
            echo "Workflow matrix generates  : $EXPECTED_SORTED"
            echo ""
            echo "To fix: update the branch protection required checks to match"
            echo "the matrix job names generated by .github/workflows/test.yml."
            echo ""
            echo "Job ID in test.yml           : $JOB_ID"
            echo "Current matrix node-versions : $VERSIONS"
            exit 1
          fi
